name: linux-core

# GlyphCore e glyphd precisam compilar e passar nos testes em Linux.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Versão
        run: swift --version
      - name: Build
        run: swift build
      - name: Testes
        run: swift test --parallel
      - name: glyphd mock valida o próprio protocolo
        run: swift run glyphd mock --fast | swift run glyphd validate
      - name: A arte está em dia com o código
        run: |
          swift run glyph-art
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code -- docs/art Packs/default/stickers || {
            echo "::error::A arte mudou. Rode Scripts/gerar-arte.sh e faça commit."; exit 1; }
